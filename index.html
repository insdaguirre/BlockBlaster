<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockBlaster</title>
    <meta name="description" content="A polished browser FPS built with TypeScript, Three.js, and Vite. Drop onto a stylized beachhead, clear the enemy squad, and defeat the boss.">
    <meta name="theme-color" content="#0a0a0f">
    <meta property="og:title" content="BlockBlaster">
    <meta property="og:description" content="A premium-feeling browser FPS with a stylized voxel beachhead, procedural audio, and a complete boss encounter.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./og-image.svg">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-overlay"></div>
        <div id="start-screen">
            <div class="start-card">
                <div class="eyebrow">Beachhead Protocol</div>
                <h1 class="hero-title">BlockBlaster</h1>
                <p class="hero-body">A compact, high-intensity browser FPS. Sweep the beach, survive the counterfire, and close out the boss encounter with a clean run.</p>
                <div class="start-grid">
                    <div class="start-meta">
                        <div class="start-tag">TypeScript • Three.js • Procedural Audio</div>
                        <div class="start-high-score" id="start-high-score">Best Run 0</div>
                    </div>
                    <button id="start-button" class="hud-button primary-button">Enter Beachhead</button>
                </div>
                <div class="control-list">
                    <div class="control-row"><strong>WASD</strong><span>Move</span></div>
                    <div class="control-row"><strong>Mouse</strong><span>Look</span></div>
                    <div class="control-row"><strong>Click</strong><span>Fire</span></div>
                    <div class="control-row"><strong>R / M / Esc</strong><span>Reload, mute, pause</span></div>
                    <div class="control-row"><strong>Space</strong><span>Jump</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const isViteDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '3000';
        const bootstrapScript = document.createElement('script');
        bootstrapScript.type = 'module';

        if (isViteDev) {
            bootstrapScript.src = '/src/main.ts';
        } else {
            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = './dist/assets/index.css';
            document.head.appendChild(stylesheet);
            bootstrapScript.src = './dist/assets/index.js';
        }

        document.body.appendChild(bootstrapScript);
    </script>
</body>
</html>
